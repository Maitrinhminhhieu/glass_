<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>macOS Glass Tab — Lời nhắn</title>
  <style>
    :root{
      --bg1:#0f1226; --bg2:#1a1f3b;
      --glass:rgba(255,255,255,.10);
      --glass-border:rgba(255,255,255,.25);
      --glass-strong:rgba(255,255,255,.18);
      --text:#f4f6ff; --muted:#c7c9d3; --accent:#7aa2ff;
      --tab-bg:rgba(255,255,255,.14); --tab-active:rgba(255,255,255,.22);
      --shadow:0 30px 80px rgba(0,0,0,.45), 0 6px 20px rgba(0,0,0,.35);
      --radius:16px;
    }

    html,body{height:100%}
    body{
      margin:0;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, #3c2fb7 0%, transparent 60%),
        radial-gradient(1000px 700px at 85% 30%, #ff6ea9 0%, transparent 60%),
        radial-gradient(900px 900px at 50% 90%, #00ffd1 0%, transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow:auto; /* Cho phép cuộn trên mobile */
    }

    /* Blob nền */
    .blob{
      position:fixed; filter:blur(60px); opacity:.35;
      pointer-events:none; mix-blend-mode:screen;
      animation:float 22s ease-in-out infinite alternate;
    }
    .blob.b1{ width:600px; height:600px; background:#6f7cff; top:-120px; left:-120px; }
    .blob.b2{ width:500px; height:500px; background:#ff62a8; bottom:-80px; right:10%; animation-duration:26s; }
    .blob.b3{ width:520px; height:520px; background:#4dffd3; top:60%; left:55%; animation-duration:28s; }

    @keyframes float{
      0%{ transform:translate3d(0,0,0) scale(1) }
      100%{ transform:translate3d(30px,-20px,0) scale(1.05) }
    }

    /* Khung cửa sổ */
    .window{
      position:relative;
      width:min(980px, 92vw);
      max-height:80vh;
      margin:clamp(24px, 8vh, 96px) auto;
      border-radius:calc(var(--radius) + 4px);
      background:var(--glass);
      border:1px solid var(--glass-border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px) saturate(130%);
      -webkit-backdrop-filter:blur(18px) saturate(130%);
      display:flex; flex-direction:column; overflow:hidden;
    }

    /* Thanh tiêu đề + tab */
    .titlebar{
      display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));
      border-bottom:1px solid var(--glass-border);
    }
    .traffic{ display:flex; gap:8px; margin-right:8px; }
    .dot{ width:12px; height:12px; border-radius:50%;
      border:1px solid rgba(0,0,0,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
    .red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c940}

    .tabs{
      display:flex; align-items:center; gap:8px; margin-left:6px;
    }
    .tab{
      padding:8px 14px; border-radius:10px; background:var(--tab-bg);
      border:1px solid var(--glass-border); box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
      color:var(--muted); font-size:14px; user-select:none; white-space:nowrap;
    }
    .tab.active{ background:var(--tab-active); color:var(--text) }
    .spacer{flex:1}

    /* Nội dung */
    .content{
      position:relative;
      padding: clamp(18px, 2.4vw, 28px) clamp(18px, 3vw, 40px) clamp(72px, 6vw, 84px); /* chừa chỗ cho controls dính đáy */
      line-height:1.6;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }
    .headline{ font-size:clamp(18px, 2.2vw, 22px); color:var(--muted); margin:6px 0 14px }
    .quote{ font-size:clamp(20px, 2.6vw, 28px); font-weight:600; letter-spacing:.2px; margin:6px 0 0; white-space:pre-wrap }

    .caret{
      display:inline-block; width:.6ch; margin-left:2px;
      border-right:2px solid var(--accent);
      animation:blink 1s steps(2,start) infinite; vertical-align:-2px;
    }
    @keyframes blink{ 0%,40%{opacity:1} 50%,100%{opacity:0} }

    /* Điều khiển (mặc định desktop: góc phải) */
    .controls{
      position:absolute; right:18px; bottom:16px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .btn{
      font:inherit;
      padding:10px 14px;
      border-radius:10px; border:1px solid var(--glass-border);
      background:var(--glass-strong); color:var(--text);
      cursor:pointer; transition:transform .06s ease;
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      min-height:44px; min-width:44px; /* hit target mobile */
      touch-action:manipulation;
    }
    .btn:active{ transform:translateY(1px) }

    /* Fallback không hỗ trợ backdrop-filter */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .window{ background:rgba(30,35,60,.92) }
      .tab,.btn{ background:rgba(255,255,255,.08) }
    }

    /* Giảm chuyển động */
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important }
    }

    /* ======= TỐI ƯU DI ĐỘNG ======= */
    @media (max-width: 600px){
      /* Nền nhẹ hơn cho hiệu năng */
      body{
        background:
          radial-gradient(600px 400px at 25% 8%, #3c2fb7 0%, transparent 60%),
          radial-gradient(520px 360px at 85% 30%, #ff6ea9 0%, transparent 60%),
          radial-gradient(520px 520px at 50% 90%, #00ffd1 0%, transparent 55%),
          linear-gradient(160deg, var(--bg1), var(--bg2));
      }
      .blob{ filter:blur(40px); }
      .blob.b1{ width:340px; height:340px; top:-80px; left:-80px }
      .blob.b2{ width:300px; height:300px; bottom:-60px; right:6% }
      .blob.b3{ width:320px; height:320px; top:58%; left:55% }

      /* Cửa sổ full-width, tận dụng vùng an toàn iOS */
      .window{
        width:100vw; max-width:100%;
        height:auto; max-height:92dvh;
        margin:calc(env(safe-area-inset-top,0) + 6px) 0 calc(env(safe-area-inset-bottom,0) + 6px);
        border-radius:12px; /* bớt cong để khớp màn nhỏ */
        box-shadow:0 16px 48px rgba(0,0,0,.38), 0 4px 16px rgba(0,0,0,.28);
      }
      @supports (backdrop-filter: blur(1px)){
        .window{ backdrop-filter:blur(10px) saturate(120%); -webkit-backdrop-filter:blur(10px) saturate(120%) }
      }

      /* Tiêu đề dính trên cùng khi cuộn */
      .titlebar{
        position:sticky; top:0; z-index:5;
        padding:8px 10px;
      }
      .traffic .dot{ width:10px; height:10px }

      /* Tabs cuộn ngang, ẩn scrollbar */
      .tabs{
        overflow-x:auto; -webkit-overflow-scrolling:touch;
        scrollbar-width:none;
        max-width:100%;
      }
      .tabs::-webkit-scrollbar{ display:none }
      .tab{ flex:0 0 auto; padding:10px 12px; font-size:15px }

      /* Nội dung thoáng hơn, chừa chỗ cho controls dính đáy */
      .content{
        padding:16px 14px calc(84px + env(safe-area-inset-bottom,0));
      }
      .headline{ font-size:18px }
      .quote{ font-size:20px }

      /* Điều khiển chuyển sang sticky bar cuối trang */
      .controls{
        position:sticky; inset:auto 0 0 0; z-index:6;
        display:flex; justify-content:center; gap:8px; padding:10px;
        background:linear-gradient(180deg, transparent, rgba(0,0,0,.35));
        backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border-top:1px solid var(--glass-border);
      }
      .btn{ flex:1 1 auto; min-width:0 } /* nút co giãn đều */
    }
  </style>
</head>
<body>
  <!-- Nền động -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- Cửa sổ kiểu macOS -->
  <section class="window" role="group" aria-label="Cửa sổ macOS giả lập">
    <div class="titlebar" role="toolbar" aria-label="Thanh tiêu đề">
      <div class="traffic" aria-hidden="true">
        <div class="dot red" title="Đóng"></div>
        <div class="dot yellow" title="Thu nhỏ"></div>
        <div class="dot green" title="Phóng to"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="Thẻ">
        <div class="tab active" role="tab" aria-selected="true">Lời nhắn</div>
        <div class="tab" role="tab" aria-selected="false">Ghi chú</div>
        <div class="tab" role="tab" aria-selected="false">Hành trình</div>
      </div>
      <div class="spacer"></div>
    </div>

    <div class="content" id="content" tabindex="0">
      <div class="headline">Một chút “glass” cho tinh thần cứng cáp.</div>
      <div class="quote" id="quote" aria-live="polite"></div>
      <span class="caret" id="caret" aria-hidden="true"></span>

      <div class="controls" aria-label="Điều khiển">
        <button class="btn" id="replay">Phát lại</button>
        <button class="btn" id="pause">Tạm dừng</button>
        <button class="btn" id="resume">Tiếp tục</button>
        <button class="btn" id="copy">Sao chép</button>
      </div>
    </div>
  </section>

  <script>
    // Nội dung
    const TEXT = `Đôi lúc cũng mệt mỏi lắm, nhưng đã đặt chân đến đây rồi thì phải cố gắng lên thôi. 
Sau lưng là đôi bàn tay thô ráp ấy, những bàn tay đã vất vả lo cho con đến nhường nào. 
Hãy cố gắng hơn nữa, vì hành trình tìm kiếm cơ hội, hãy mạnh mẽ lên, vì một tương lai không được phép lùi bước.`;

    const elQuote = document.getElementById('quote');
    const caret = document.getElementById('caret');
    const btnReplay = document.getElementById('replay');
    const btnPause = document.getElementById('pause');
    const btnResume = document.getElementById('resume');
    const btnCopy = document.getElementById('copy');

    let idx = 0, timer = null, paused = false;

    function typeNext(){
      if (paused) return;
      if (idx <= TEXT.length){
        elQuote.textContent = TEXT.slice(0, idx++);
        const ch = TEXT[idx-1] || '';
        const base = ('.!,?'.includes(ch)) ? 70 : 24;
        const delay = base + 8 + Math.random()*10;
        timer = setTimeout(typeNext, delay);
      } else {
        caret.style.display = 'none';
      }
    }

    btnReplay.addEventListener('click', () => {
      clearTimeout(timer); idx = 0; paused = false;
      elQuote.textContent = ''; caret.style.display = 'inline-block';
      typeNext();
    });
    btnPause.addEventListener('click', () => { paused = true; clearTimeout(timer); });
    btnResume.addEventListener('click', () => { if (!paused) return; paused = false; typeNext(); });

    btnCopy.addEventListener('click', async () => {
      try{
        await navigator.clipboard.writeText(TEXT);
        btnCopy.textContent = 'Đã sao chép ✓';
      }catch(e){
        btnCopy.textContent = 'Không sao chép được';
      }finally{
        setTimeout(()=> btnCopy.textContent = 'Sao chép', 1500);
      }
    });

    // Tự phát khi tải
    typeNext();
  </script>
</body>
</html>
