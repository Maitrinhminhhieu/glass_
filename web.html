<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>macOS Glass Tab — Lời nhắn</title>
  <style>
    :root{
      --bg1: #0f1226;
      --bg2: #1a1f3b;
      --glass: rgba(255,255,255,.10);
      --glass-border: rgba(255,255,255,.25);
      --glass-strong: rgba(255,255,255,.18);
      --text: #f4f6ff;
      --muted: #c7c9d3;
      --accent: #7aa2ff;
      --tab-bg: rgba(255,255,255,.14);
      --tab-active: rgba(255,255,255,.22);
      --shadow: 0 30px 80px rgba(0,0,0,.45), 0 6px 20px rgba(0,0,0,.35);
      --radius: 16px;
    }

    /* Toàn màn hình với nền động */
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji", "Segoe UI Symbol";
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #3c2fb7 0%, transparent 60%),
                  radial-gradient(1000px 700px at 85% 30%, #ff6ea9 0%, transparent 60%),
                  radial-gradient(900px 900px at 50% 90%, #00ffd1 0%, transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    /* Bong bóng nhạt động, tăng cảm giác "glass" */
    .blob{
      position: fixed;
      filter: blur(60px);
      opacity:.35;
      pointer-events:none;
      mix-blend-mode: screen;
      animation: float 22s ease-in-out infinite alternate;
    }
    .blob.b1{ width: 600px; height: 600px; background:#6f7cff; top:-120px; left:-120px; }
    .blob.b2{ width: 500px; height: 500px; background:#ff62a8; bottom: -80px; right: 10%; animation-duration: 26s;}
    .blob.b3{ width: 520px; height: 520px; background:#4dffd3; top: 60%; left: 55%; animation-duration: 28s;}

    @keyframes float{
      0%{ transform: translate3d(0,0,0) scale(1);}
      100%{ transform: translate3d(30px,-20px,0) scale(1.05);}
    }

    /* Khung cửa sổ macOS */
    .window{
      position: relative;
      width: min(980px, 92vw);
      max-height: 80vh;
      margin: clamp(24px, 8vh, 96px) auto;
      border-radius: calc(var(--radius) + 4px);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Thanh tiêu đề macOS với 3 nút */
    .titlebar{
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));
      border-bottom: 1px solid var(--glass-border);
    }
    .traffic{
      display:flex; gap:8px; margin-right: 8px;
    }
    .dot{
      width:12px; height:12px; border-radius:50%;
      border: 1px solid rgba(0,0,0,.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }
    .red{ background:#ff5f57; }
    .yellow{ background:#febc2e; }
    .green{ background:#28c940; }

    /* Thanh tab kiểu Safari */
    .tabs{
      display:flex; align-items:center; gap:8px;
      margin-left: 6px;
    }
    .tab{
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--tab-bg);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 14px;
      user-select: none;
    }
    .tab.active{
      background: var(--tab-active);
      color: var(--text);
    }
    .spacer{flex:1}

    /* Vùng nội dung */
    .content{
      position: relative;
      padding: clamp(18px, 2.4vw, 28px) clamp(18px, 3vw, 40px) clamp(24px, 3.2vw, 48px);
      line-height: 1.6;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .headline{
      font-size: clamp(18px, 2.2vw, 22px);
      color: var(--muted);
      margin: 6px 0 14px;
    }

    .quote{
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 600;
      letter-spacing: .2px;
      margin: 6px 0 0;
      white-space: pre-wrap;
    }

    /* Hiệu ứng gõ chữ */
    .caret{
      display:inline-block;
      width: .6ch;
      margin-left: 2px;
      border-right: 2px solid var(--accent);
      animation: blink 1s steps(2, start) infinite;
      vertical-align: -2px;
    }
    @keyframes blink{ 0%, 40% {opacity:1} 50%, 100% {opacity:0} }

    /* Nút chuyển hiệu ứng */
    .controls{
      position: absolute; right: 18px; bottom: 16px;
      display:flex; gap:10px; flex-wrap: wrap;
    }
    .btn{
      font: inherit;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      color: var(--text);
      cursor: pointer;
      transition: transform .06s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .btn:active{ transform: translateY(1px) }

    /* Fallback khi không hỗ trợ backdrop-filter */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .window{ background: rgba(30,35,60,.92); }
      .tab, .btn{ background: rgba(255,255,255,.08); }
    }

    /* Tôn trọng người dùng giảm chuyển động */
    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important }
    }
  </style>
</head>
<body>
  <!-- Nền “màu khói” động -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- Cửa sổ kiểu macOS -->
  <section class="window" role="group" aria-label="Cửa sổ macOS giả lập">
    <div class="titlebar" role="toolbar" aria-label="Thanh tiêu đề">
      <div class="traffic" aria-hidden="true">
        <div class="dot red" title="Đóng"></div>
        <div class="dot yellow" title="Thu nhỏ"></div>
        <div class="dot green" title="Phóng to"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="Thẻ">
        <div class="tab active" role="tab" aria-selected="true">Lời nhắn</div>
        <div class="tab" role="tab" aria-selected="false">Ghi chú</div>
        <div class="tab" role="tab" aria-selected="false">Hành trình</div>
      </div>
      <div class="spacer"></div>
    </div>

    <div class="content" id="content" tabindex="0">
      <div class="headline">Một chút “glass” cho tinh thần cứng cáp.</div>
      <div class="quote" id="quote" aria-live="polite"></div>
      <span class="caret" id="caret" aria-hidden="true"></span>

      <div class="controls" aria-label="Điều khiển">
        <button class="btn" id="replay">Phát lại hiệu ứng</button>
        <button class="btn" id="pause">Tạm dừng</button>
        <button class="btn" id="resume">Tiếp tục</button>
        <button class="btn" id="copy">Sao chép</button>
      </div>
    </div>
  </section>

  <script>
    // Nội dung bạn muốn hiển thị (nguyên văn, có xuống dòng hợp lý)
    const TEXT = `Đôi lúc cũng mệt mỏi lắm, nhưng đã đặt chân đến đây rồi thì phải cố gắng lên thôi. 
Sau lưng là đôi bàn tay thô ráp ấy, những bàn tay đã vất vả lo cho con đến nhường nào. 
Hãy cố gắng hơn nữa, vì hành trình tìm kiếm cơ hội, hãy mạnh mẽ lên, vì một tương lai không được phép lùi bước.`;

    const elQuote = document.getElementById('quote');
    const caret = document.getElementById('caret');
    const btnReplay = document.getElementById('replay');
    const btnPause = document.getElementById('pause');
    const btnResume = document.getElementById('resume');
    const btnCopy = document.getElementById('copy');

    let idx = 0;
    let timer = null;
    let paused = false;

    // Hiệu ứng gõ chữ
    function typeNext(){
      if (paused) return;
      if (idx <= TEXT.length){
        elQuote.textContent = TEXT.slice(0, idx);
        idx++;
        const ch = TEXT[idx-1] || '';
        const base = (ch === '.' || ch === ',' || ch === '!' || ch === '?') ? 70 : 24;
        const jitter = 8 + Math.random()*10;
        const delay = base + jitter; // ms
        timer = setTimeout(typeNext, delay);
      } else {
        caret.style.display = 'none';
      }
    }

    // Điều khiển
    btnReplay.addEventListener('click', () => {
      clearTimeout(timer);
      idx = 0;
      elQuote.textContent = '';
      caret.style.display = 'inline-block';
      paused = false;
      typeNext();
    });

    btnPause.addEventListener('click', () => { paused = true; clearTimeout(timer); });
    btnResume.addEventListener('click', () => {
      if (!paused) return;
      paused = false;
      typeNext();
    });

    btnCopy.addEventListener('click', async () => {
      try{
        await navigator.clipboard.writeText(TEXT);
        btnCopy.textContent = 'Đã sao chép ✓';
        setTimeout(()=> btnCopy.textContent = 'Sao chép', 1500);
      }catch(e){
        btnCopy.textContent = 'Không sao chép được';
        setTimeout(()=> btnCopy.textContent = 'Sao chép', 1500);
      }
    });

    // Tự phát khi tải trang
    typeNext();
  </script>
</body>
</html>
